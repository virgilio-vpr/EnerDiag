        202:
          description: 'Simulação registrada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: queued
                    created_at: '2026-10-24T12:00:00Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: queued
                      created_at:
                        type: string
                        example: '2026-10-24T12:00:00Z'
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
