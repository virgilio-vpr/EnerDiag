openapi: 3.0.3
info:
  title: 'EnerDiag — Documentação da API'
  description: 'API do EnerDiag para análise de faturas de energia do Grupo A.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Administração: clientes'
    description: 'Consulta paginada de clientes e seus perfis'
  -
    name: 'Administração: leads'
    description: 'Lista solicitações de distribuidoras não atendidas e pedidos de contato'
  -
    name: 'Administração: parâmetros'
    description: 'Consulta e versionamento de parâmetros regulatórios nacionais'
  -
    name: 'Administração: relatórios'
    description: 'Edição de textos e reenvio de relatórios'
  -
    name: 'Administração: simulações'
    description: 'Consulta paginada de simulações e dados extraídos'
  -
    name: 'Administração: tarifas'
    description: 'Consulta e versionamento de tarifas por vigência'
  -
    name: Autenticação
    description: 'Cadastro e acesso de clientes'
  -
    name: Exemplos
    description: 'Endpoints de exemplo para validação da documentação'
  -
    name: Leads
    description: 'Interesse em distribuidoras ainda não atendidas'
  -
    name: 'Minha conta'
    description: 'Consulta, atualização e exclusão da conta autenticada'
  -
    name: Simulações
    description: 'Envio e processamento de faturas de energia'
  -
    name: Sistema
    description: 'Endpoints do sistema e integridade da API'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Envie o token de acesso no cabeçalho <code>Authorization: Bearer {token}</code> para os endpoints protegidos.'
security:
  -
    default: []
paths:
  /api/v1/admin/customers:
    get:
      summary: 'Listar clientes'
      operationId: listarClientes
      description: 'Retorna clientes em páginas, com dados de contato e perfil.'
      parameters: []
      responses:
        200:
          description: 'Clientes paginados'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Ana Souza'
                      email: ana@empresa.com.br
                      phone: '11999999999'
                      role: customer
                      email_verified_at: '2026-10-24T12:00:00Z'
                      contact_requested_at: null
                      profile:
                        company_name: 'Empresa Exemplo Ltda.'
                  links: {}
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Ana Souza'
                        email: ana@empresa.com.br
                        phone: '11999999999'
                        role: customer
                        email_verified_at: '2026-10-24T12:00:00Z'
                        contact_requested_at: null
                        profile:
                          company_name: 'Empresa Exemplo Ltda.'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Ana Souza'
                        email:
                          type: string
                          example: ana@empresa.com.br
                        phone:
                          type: string
                          example: '11999999999'
                        role:
                          type: string
                          example: customer
                        email_verified_at:
                          type: string
                          example: '2026-10-24T12:00:00Z'
                        contact_requested_at:
                          type: string
                          example: null
                          nullable: true
                        profile:
                          type: object
                          properties:
                            company_name:
                              type: string
                              example: 'Empresa Exemplo Ltda.'
                  links:
                    type: object
                    properties: {}
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 1
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Esta ação não é autorizada.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Esta ação não é autorizada.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Administração: clientes'
  '/api/v1/admin/customers/{id}':
    get:
      summary: 'Consultar cliente'
      operationId: consultarCliente
      description: 'Retorna os dados de contato e perfil de um cliente.'
      parameters: []
      responses:
        200:
          description: 'Cliente encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Ana Souza'
                    email: ana@empresa.com.br
                    phone: '11999999999'
                    role: customer
                    profile:
                      company_name: 'Empresa Exemplo Ltda.'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Ana Souza'
                      email:
                        type: string
                        example: ana@empresa.com.br
                      phone:
                        type: string
                        example: '11999999999'
                      role:
                        type: string
                        example: customer
                      profile:
                        type: object
                        properties:
                          company_name:
                            type: string
                            example: 'Empresa Exemplo Ltda.'
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
        404:
          description: 'Cliente não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não encontrado.'
                  code: NOT_FOUND
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não encontrado.'
                  code:
                    type: string
                    example: NOT_FOUND
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Administração: clientes'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the customer.'
        example: '564'
        required: true
        schema:
          type: string
  /api/v1/admin/leads:
    get:
      summary: 'Listar leads e pedidos de contato'
      operationId: listarLeadsEPedidosDeContato
      description: 'Retorna uma lista paginada com leads de distribuidoras e solicitações de contato de clientes.'
      parameters: []
      responses:
        200:
          description: 'Leads paginados'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: unsupported_distributor
                      id: 1
                      email: cliente@empresa.com.br
                      distributor_name: 'Distribuidora X'
                      reason: 'Fora da área atendida'
                      customer_name: null
                      requested_at: '2026-10-24T12:00:00Z'
                  links: {}
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: unsupported_distributor
                        id: 1
                        email: cliente@empresa.com.br
                        distributor_name: 'Distribuidora X'
                        reason: 'Fora da área atendida'
                        customer_name: null
                        requested_at: '2026-10-24T12:00:00Z'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: unsupported_distributor
                        id:
                          type: integer
                          example: 1
                        email:
                          type: string
                          example: cliente@empresa.com.br
                        distributor_name:
                          type: string
                          example: 'Distribuidora X'
                        reason:
                          type: string
                          example: 'Fora da área atendida'
                        customer_name:
                          type: string
                          example: null
                          nullable: true
                        requested_at:
                          type: string
                          example: '2026-10-24T12:00:00Z'
                  links:
                    type: object
                    properties: {}
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 1
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Administração: leads'
  /api/v1/admin/parameters:
    get:
      summary: 'Listar parâmetros regulatórios'
      operationId: listarParmetrosRegulatrios
      description: 'Retorna os parâmetros e suas vigências em ordem decrescente.'
      parameters: []
      responses:
        200:
          description: 'Parâmetros paginados'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      key: idle_demand_discount_fallback
                      value: '0.18000'
                      state: null
                      valid_from: '2021-01-01'
                      valid_to: null
                  links: {}
                  meta: {}
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        key: idle_demand_discount_fallback
                        value: '0.18000'
                        state: null
                        valid_from: '2021-01-01'
                        valid_to: null
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        key:
                          type: string
                          example: idle_demand_discount_fallback
                        value:
                          type: string
                          example: '0.18000'
                        state:
                          type: string
                          example: null
                          nullable: true
                        valid_from:
                          type: string
                          example: '2021-01-01'
                        valid_to:
                          type: string
                          example: null
                          nullable: true
                  links:
                    type: object
                    properties: {}
                  meta:
                    type: object
                    properties: {}
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Administração: parâmetros'
    post:
      summary: 'Criar versão de parâmetro regulatório'
      operationId: criarVersoDeParmetroRegulatrio
      description: 'Registra um novo valor nacional com vigência, preservando versões anteriores.'
      parameters: []
      responses:
        201:
          description: 'Nova versão criada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    key: idle_demand_discount_fallback
                    value: '0.20000'
                    state: null
                    valid_from: '2027-01-01'
                    valid_to: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      key:
                        type: string
                        example: idle_demand_discount_fallback
                      value:
                        type: string
                        example: '0.20000'
                      state:
                        type: string
                        example: null
                        nullable: true
                      valid_from:
                        type: string
                        example: '2027-01-01'
                      valid_to:
                        type: string
                        example: null
                        nullable: true
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Dados inválidos ou vigência sobreposta'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Os dados informados são inválidos.'
                  code: VALIDATION_ERROR
                  errors: {}
                properties:
                  message:
                    type: string
                    example: 'Os dados informados são inválidos.'
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  errors:
                    type: object
                    properties: {}
      tags:
        - 'Administração: parâmetros'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: 'Chave do parâmetro.'
                  example: idle_demand_discount_fallback
                value:
                  type: number
                  description: 'Novo valor decimal.'
                  example: '0.18000'
                valid_from:
                  type: string
                  description: 'Início da nova vigência.'
                  example: '2027-01-01'
                valid_to:
                  type: string
                  description: 'Fim opcional da vigência.'
                  example: architecto
              required:
                - key
                - value
                - valid_from
  '/api/v1/admin/reports/{id}':
    put:
      summary: 'Editar relatório'
      operationId: editarRelatrio
      description: 'Atualiza textos explicativos e recomendações, preservando os resultados calculados e registrando uma revisão.'
      parameters: []
      responses:
        200:
          description: 'Relatório atualizado e revisão registrada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    total_monthly_savings: '100.00'
                    explanatory_texts:
                      - 'Texto revisado'
                    recommendations:
                      - 'Recomendação revisada'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      total_monthly_savings:
                        type: string
                        example: '100.00'
                      explanatory_texts:
                        type: array
                        example:
                          - 'Texto revisado'
                        items:
                          type: string
                      recommendations:
                        type: array
                        example:
                          - 'Recomendação revisada'
                        items:
                          type: string
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Campos inválidos ou tentativa de alterar resultados'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Os dados informados são inválidos.'
                  code: VALIDATION_ERROR
                  errors: {}
                properties:
                  message:
                    type: string
                    example: 'Os dados informados são inválidos.'
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  errors:
                    type: object
                    properties: {}
      tags:
        - 'Administração: relatórios'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                explanatory_texts:
                  type: array
                  description: 'Textos explicativos do relatório.'
                  example:
                    - 'Ajuste recomendado da demanda.'
                  items:
                    type: string
                recommendations:
                  type: array
                  description: 'Recomendações do relatório.'
                  example:
                    - 'Avalie a adequação da demanda contratada.'
                  items:
                    type: string
                simulation_id:
                  type: string
                  description: ''
                  example: null
                total_monthly_savings:
                  type: string
                  description: ''
                  example: null
                total_yearly_savings:
                  type: string
                  description: ''
                  example: null
                savings_percentage:
                  type: string
                  description: ''
                  example: null
                demand_savings_monthly:
                  type: string
                  description: ''
                  example: null
                demand_savings_yearly:
                  type: string
                  description: ''
                  example: null
                overrun_savings_monthly:
                  type: string
                  description: ''
                  example: null
                overrun_savings_yearly:
                  type: string
                  description: ''
                  example: null
                reactive_savings_monthly:
                  type: string
                  description: ''
                  example: null
                reactive_savings_yearly:
                  type: string
                  description: ''
                  example: null
                migration_savings_monthly:
                  type: string
                  description: ''
                  example: null
                migration_savings_yearly:
                  type: string
                  description: ''
                  example: null
                recommended_modality:
                  type: string
                  description: ''
                  example: null
                optimal_demand_peak:
                  type: string
                  description: ''
                  example: null
                optimal_demand_off_peak:
                  type: string
                  description: ''
                  example: null
                optimal_demand_single:
                  type: string
                  description: ''
                  example: null
                chart_series:
                  type: string
                  description: ''
                  example: null
                warnings:
                  type: string
                  description: ''
                  example: null
                r_values:
                  type: string
                  description: ''
                  example: null
                k_values:
                  type: string
                  description: ''
                  example: null
                algorithm_version:
                  type: string
                  description: ''
                  example: null
                tariff_version_ids:
                  type: string
                  description: ''
                  example: null
                regulatory_parameter_version_ids:
                  type: string
                  description: ''
                  example: null
              required:
                - explanatory_texts
                - recommendations
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the report.'
        example: 564
        required: true
        schema:
          type: integer
  '/api/v1/admin/reports/{id}/resend':
    post:
      summary: 'Reenviar relatório'
      operationId: reenviarRelatrio
      description: 'Envia manualmente por e-mail o resumo atual do relatório ao cliente.'
      parameters: []
      responses:
        200:
          description: 'E-mail enviado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Relatório reenviado por e-mail.'
                properties:
                  message:
                    type: string
                    example: 'Relatório reenviado por e-mail.'
        401:
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não autenticado.'
                  code: UNAUTHENTICATED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        403:
          description: 'Acesso restrito ao admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Acesso não autorizado.'
                  code: FORBIDDEN
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Acesso não autorizado.'
                  code:
                    type: string
                    example: FORBIDDEN
                  errors:
                    type: string
                    example: null
                    nullable: true
        404:
          description: 'Relatório não encontrado'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Recurso não encontrado.'
                  code: NOT_FOUND
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'Recurso não encontrado.'
                  code:
                    type: string
                    example: NOT_FOUND
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'Administração: relatórios'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the report.'
        example: 564
        required: true
        schema:
          type: integer
  /api/v1/admin/simulations:
    get:
      summary: 'Listar simulações'
      operationId: listarSimulaes
      description: 'Retorna simulações paginadas com identificação do cliente.'
      parameters: []
      responses:
        200:
          description: 'Simulações paginadas'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      user_id: 1
                      status: completed
                      months_count: 12
                      total_monthly_savings: '100.00'
                      total_yearly_savings: '1200.00'
                      expires_at: null
                      customer:
                        id: 1
                        name: 'Ana Souza'
                        email: ana@empresa.com.br
                  links: {}
                  meta:
                    current_page: 1
                    per_page: 15
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        user_id: 1
                        status: completed
