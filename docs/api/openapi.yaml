                properties:
                  message:
                    type: string
                    example: 'Não autenticado.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  errors:
                    type: string
                    example: null
                    nullable: true
        422:
          description: 'Distribuidora sem leitor'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A distribuidora selecionada ainda não possui leitor disponível.'
                  code: DISTRIBUTOR_UNSUPPORTED
                  errors: null
                properties:
                  message:
                    type: string
                    example: 'A distribuidora selecionada ainda não possui leitor disponível.'
                  code:
                    type: string
                    example: DISTRIBUTOR_UNSUPPORTED
                  errors:
                    type: string
