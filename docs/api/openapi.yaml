        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'Nome da empresa.'
                  example: 'Empresa Exemplo Ltda.'
                cnpj:
                  type: string
                  description: 'Must not be greater than 18 characters.'
                  example: ngzmiyvdljnikhwa
                  nullable: true
                distributor_id:
                  type: integer
                  description: 'Identificador da distribuidora atendida.'
                  example: 1
                distributor_name:
                  type: string
                  description: 'Nome de uma distribuidora ainda não atendida.'
                  example: 'Distribuidora Exemplo'
                transformer_power_kva:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 99999999.99.'
                  example: 7
                  nullable: true
                address_details:
                  type: string
                  description: 'Endereço da empresa.'
                  example: 'Rua Exemplo, 100, São Paulo/SP'
                substation_same_address:
                  type: boolean
                  description: 'Indica se o endereço da subestação é o mesmo da fatura.'
                  example: true
                substation_address:
                  type: string
                  description: 'This field is required when <code>substation_same_address</code> is <code>false</code>. Must not be greater than 5000 characters.'
                  example: m
                  nullable: true
                invoices:
                  type: array
                  description: 'Must be a file.'
                  items:
                    type: string
                    format: binary
                'invoices[]':
                  type: string
                  format: binary
                  description: 'Faturas PDF (de 6 a 12 arquivos).'
              required:
                - company_name
                - distributor_id
                - distributor_name
                - address_details
                - substation_same_address
                - invoices
                - 'invoices[]'
