# Run separately from development: docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
x-app: &app
  image: enerdiag-api:${IMAGE_TAG:-local}
  env_file: ${PRODUCTION_ENV_FILE:-.env.production}
  environment:
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set a persistent Laravel APP_KEY}
    APP_URL: ${APP_URL:?Set the public HTTPS URL}
    FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS URL}
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: 360
    CACHE_STORE: database
    LOG_CHANNEL: stderr
    SESSION_SECURE_COOKIE: "true"
  volumes:
    - invoice_temp:/var/www/html/storage/app/private/invoice-temp
  restart: unless-stopped
  stop_grace_period: 330s
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-enerdiag}
      POSTGRES_USER: ${DB_USERNAME:-enerdiag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: [php, artisan, migrate, --force, --no-interaction]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    build: ./backend
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: [php, artisan, 'queue:work', database, '--sleep=3', '--tries=3', '--backoff=60,180', '--timeout=300', '--max-time=3600', --no-interaction]
  scheduler:
    <<: *app
    command: [php, artisan, 'schedule:work', --no-interaction]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    secrets:
      - tls_certificate
      - tls_private_key
    tmpfs:
      - /tmp:mode=0700,uid=101,gid=101
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider --no-check-certificate https://127.0.0.1/up']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  invoice_temp:
secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE:?Set TLS_CERTIFICATE to the full-chain PEM file}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY:?Set TLS_PRIVATE_KEY to the private key PEM file}
