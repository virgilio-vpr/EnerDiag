server {
    listen 80;
    access_log off;
    error_log /dev/stderr crit;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    index index.html;
    # Allow multipart overhead above the application's 120 MiB aggregate limit.
    client_max_body_size 122m;
    client_body_temp_path /tmp/client-body;
    client_body_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ~ ^/(api(?:/|$)|up$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass api:9000;
        fastcgi_read_timeout 310s;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
